<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;display=swap');
      .brand-text {
        font-family: 'Syne', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 110px;
        font-weight: 800;
        letter-spacing: -0.05em;
        fill: url(#chromeMirror);
      }
      .brand-dot {
        fill: url(#mauveGem);
        filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.8));
      }
    </style>

    <!-- Dégradé Spéculaire Chrome Liquide / Argenté Pur -->
    <linearGradient id="chromeMirror" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="26%" stop-color="#ffffff" />
      <stop offset="38%" stop-color="#dedae8" />
      <stop offset="47%" stop-color="#848096" />
      <stop offset="52%" stop-color="#ffffff" />
      <stop offset="56%" stop-color="#ffffff" />
      <stop offset="72%" stop-color="#a4a0b6" />
      <stop offset="100%" stop-color="#524e66" />
    </linearGradient>

    <!-- Point Signature Tech Mauve Gemme Rayonnante -->
    <radialGradient id="mauveGem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </radialGradient>
  </defs>

  <g transform="translate(15, 105)">
    <text class="brand-text" x="0" y="0">webely<tspan class="brand-dot">.</tspan></text>
  </g>
</svg>
