<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%" fill="none" stroke="#131628" stroke-linecap="round" stroke-linejoin="round">
  <!-- Title handwritten sketch style -->
  <text x="250" y="58" text-anchor="middle" font-family="'Caveat', 'Comic Sans MS', cursive, 'Poppins', sans-serif" font-weight="700" font-size="38" fill="#131628" stroke="none" letter-spacing="2">ACQUISITION</text>
  <path d="M 160 72 Q 250 76 340 71" stroke="#131628" stroke-width="3.5" />

  <!-- Staircase progression steps: Visiteur -> Prospect -> Client -->
  <!-- Step 1: VISITEUR -->
  <rect x="75" y="310" width="110" height="95" stroke-width="4" rx="4" />
  <text x="130" y="365" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#131628" stroke="none" letter-spacing="0.5">VISITEUR</text>
  <!-- Little stick figure on step 1 -->
  <circle cx="130" cy="275" r="10" stroke-width="3" />
  <path d="M 130 285 L 130 308" stroke-width="3" />
  <path d="M 120 295 L 140 295" stroke-width="2.8" />

  <!-- Step 2: PROSPECT -->
  <rect x="185" y="225" width="115" height="180" stroke-width="4" rx="4" />
  <text x="242" y="315" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#131628" stroke="none" letter-spacing="0.5">PROSPECT</text>
  <!-- Stick figure climbing step 2 with headset/clipboard -->
  <circle cx="242" cy="188" r="10.5" stroke-width="3.2" />
  <path d="M 242 199 L 242 223" stroke-width="3.2" />
  <path d="M 230 208 L 254 208" stroke-width="3" />

  <!-- Step 3: CLIENT (Highlighted in green/purple with ring of success) -->
  <rect x="300" y="140" width="125" height="265" stroke="#6f00ff" stroke-width="4.5" rx="4" fill="rgba(111, 0, 255, 0.04)" />
  <text x="362" y="220" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="16" font-weight="800" fill="#6f00ff" stroke="none" letter-spacing="1">CLIENT</text>

  <!-- Big winning closer stick figure in green circle on top step -->
  <circle cx="362" cy="65" r="28" stroke="#10b981" stroke-width="4" fill="none" />
  <circle cx="362" cy="58" r="11" stroke-width="3.5" />
  <path d="M 362 69 L 362 98" stroke-width="3.5" />
  <!-- Cheering raised arms -->
  <path d="M 345 80 L 362 82 L 379 80" stroke-width="3.2" />
  <!-- Legs -->
  <path d="M 362 98 L 350 135" stroke-width="3.5" />
  <path d="M 362 98 L 374 135" stroke-width="3.5" />

  <!-- Upward arrow between steps -->
  <path d="M 125 240 Q 215 160 305 105" stroke="#10b981" stroke-width="4" stroke-dasharray="6,4" />
  <polygon points="305,95 315,108 300,112" fill="#10b981" stroke="#10b981" />
</svg>
