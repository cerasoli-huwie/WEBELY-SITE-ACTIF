<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 648" width="90mm" height="54mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Allura&amp;family=Pinyon+Script&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
      .bg { fill: #08080a; }
      
      /* Typographie Colonne Gauche */
      .qr-tag {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        fill: #78788a;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      /* Logo Style Signature Calligraphique (En dessous du QR Code) */
      .brand-signature {
        font-family: 'Allura', 'Pinyon Script', cursive;
        font-size: 54px;
        font-weight: 400;
        fill: #ffffff;
        letter-spacing: 1px;
      }
      .signature-dot {
        fill: #ff4fd8;
      }
      .signature-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        fill: #686878;
        letter-spacing: 3.5px;
        text-transform: uppercase;
      }

      /* Typographie Colonne Droite */
      .name {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.8px;
      }
      
      /* Compétences */
      .role {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        fill: #ff4fd8;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      /* Liste de Contacts */
      .contact-text {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 19.5px;
        font-weight: 600;
        fill: #ffffff;
        letter-spacing: -0.2px;
      }
      .contact-text-bold {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 20px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.2px;
      }
      .contact-text-muted {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 18.5px;
        font-weight: 500;
        fill: #a8a8b8;
        letter-spacing: -0.2px;
      }

      /* Icones Vectorielles Precises */
      .icon-stroke {
        stroke: #c2c2d1;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Footer Epure (TVA Agrandie : 15px) */
      .vat-footer {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        fill: #787888;
        letter-spacing: 1px;
      }

      .divider-line {
        stroke: rgba(255, 255, 255, 0.14);
        stroke-width: 1.2;
      }

      .crop-mark {
        stroke: rgba(255, 255, 255, 0.22);
        stroke-width: 0.75;
        fill: none;
      }
    </style>

    <!-- Paraphe Dégradé Fuchsia Signature -->
    <linearGradient id="swashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#ff4fd8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Fond Noir Veloute et Profond (Format exact fabricant 90x54mm) -->
  <rect width="1080" height="648" class="bg" />

