  <!-- LOGO STYLE SIGNATURE COUTURE (Positionné en dessous du QR Code, Y = 415) -->
  <g transform="translate(275, 415)" text-anchor="middle">
    <!-- Signature Cursive Fluide & Élégante -->
    <text class="brand-signature" x="0" y="0">Webely<tspan class="signature-dot">.</tspan></text>
    
    <!-- Paraphe / Trait de plume calligraphique sous la signature -->
    <path d="M -85,18 Q 0,38 90,10" fill="none" stroke="url(#swashGrad)" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Sous-titre Atelier / Studio -->
    <text class="signature-sub" x="0" y="40">STUDIO DIGITAL</text>
  </g>

