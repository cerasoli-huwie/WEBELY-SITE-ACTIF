<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;display=swap');
      .brand-text {
        font-family: 'Syne', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 110px;
        font-weight: 800;
        letter-spacing: -0.05em;
        fill: #09090d;
      }
      .brand-dot {
        fill: url(#mauveGemLight);
        filter: drop-shadow(0 0 8px rgba(124, 58, 237, 0.45));
      }
    </style>

    <!-- Point Signature Tech Mauve Gemme -->
    <radialGradient id="mauveGemLight" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </radialGradient>
  </defs>

  <g transform="translate(15, 105)">
    <text class="brand-text" x="0" y="0">webely<tspan class="brand-dot">.</tspan></text>
  </g>
</svg>
